# Alembic configuration.
#
# The database URL is NOT stored here - it is read from DATABASE_URL by
# migrations/env.py, so credentials never enter version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Formatting hooks are intentionally not configured: they depend on ruff being
# installed as a console script, which is not guaranteed in every environment.
# Run `ruff format migrations/` after generating a revision.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
